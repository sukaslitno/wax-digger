<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
  <title>Wax Digger</title>
</head>
<body>
  <div class="wrap">
    <h1>WAX&nbsp;DIGGER<span class="cursor">_</span></h1>

    <!-- Server status -->
    <div class="section">
      <label>Server</label>
      <div class="status-row" id="statusRow">
        <span class="dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Checking…</span>
        <button type="button" class="link-btn" id="launchBtn" hidden>Launch Wax Digger</button>
      </div>
    </div>

    <!-- Current folder -->
    <div class="section">
      <label>Output folder</label>
      <div class="folder-path" id="folderPath">—</div>
    </div>

    <!-- URL -->
    <div class="section">
      <label>Song / Album link</label>
      <input type="text" id="url" placeholder="Paste a track or album link" autocomplete="off" spellcheck="false">
    </div>

    <!-- Format -->
    <div class="section">
      <label>Format</label>
      <div class="segment">
        <input type="radio" name="fmt" id="f1" value="mp3_128">
        <label for="f1">128k</label>
        <input type="radio" name="fmt" id="f2" value="mp3_320" checked>
        <label for="f2">320k</label>
        <input type="radio" name="fmt" id="f3" value="flac">
        <label for="f3">FLAC</label>
        <input type="radio" name="fmt" id="f4" value="wav">
        <label for="f4">WAV</label>
        <input type="radio" name="fmt" id="f5" value="aac">
        <label for="f5">AAC</label>
      </div>
    </div>

    <!-- Download -->
    <div class="section">
      <button class="btn-primary" id="dlBtn">Download</button>
    </div>

    <!-- Progress -->
    <div class="section" id="progressSection" hidden>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
        <span class="progress-num" id="progressNum">0%</span>
      </div>
      <div class="progress-state" id="progressState">Queued</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
