<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WAX</title>
<style>
@font-face {
  font-family: 'DM Mono';
  font-style: normal; font-weight: 400; font-display: swap;
  src: url('dm-mono.woff2') format('woff2');
}
/* DM Mono has no Cyrillic: Russian letters come from JetBrains Mono (OFL) */
@font-face {
  font-family: 'WAX Cyrillic';
  font-style: normal; font-weight: 400; font-display: swap;
  src: url('jetbrains-mono-cyrillic.woff2') format('woff2');
  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --blue: #68D0ED;
  --yellow: #D9EF71;
  --red: #FF4C4D;
  --edge-white: #6A6A6A;
  --edge-white-hover: #7A7A7A;
  --edge-yellow: #6F7B39;
  --edge-yellow-hover: #ABBE58;
  --edge-red: #822526;
  --glow-done: #CCE168;
}

html, body {
  width: 100%; height: 100%;
  background: transparent;
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}

.modal {
  width: 600px; height: 100%;
  border-radius: 64px;
  background: #000;
  position: relative; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 32px; padding: 32px;
  font: 400 16px/normal 'DM Mono', 'WAX Cyrillic', ui-monospace, monospace;
  letter-spacing: -0.06em; color: #fff;
  -webkit-font-smoothing: antialiased;
}

.logo { width: 268px; height: 100px; flex-shrink: 0; -webkit-user-drag: none; }

.ic24 { display: inline-flex; width: 24px; height: 24px; flex-shrink: 0; }
.ic24 svg { width: 24px; height: 24px; display: block; }

.modal__corner {
  position: absolute; top: 32px; right: 32px;
  width: 24px; height: 24px; z-index: 20;
  border: 0; background: none; padding: 0; cursor: pointer; color: #fff;
  opacity: .48; transition: opacity .15s ease;
}
.modal__corner:hover { opacity: 1; }
.modal__corner--close { opacity: 1; }

/* ===== button-large ===== */
.btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px; height: 64px; padding: 2px 24px;
  border: 0; border-radius: 999px; background: transparent;
  font: 400 16px/normal 'DM Mono', 'WAX Cyrillic', ui-monospace, monospace;
  letter-spacing: -0.06em; cursor: pointer; white-space: nowrap;
  flex-shrink: 0;
}
.btn--full { width: 100%; }
.btn::before, .btn::after {
  content: ""; position: absolute; inset: 0; z-index: -1;
  border-radius: inherit; transition: opacity .15s ease;
}
.btn::before {
  background: radial-gradient(ellipse 72.9% 50% at 50% 50%, #000 0%, var(--edge) 100%);
  opacity: .55;
}
.btn::after {
  background: radial-gradient(ellipse 72.9% 50% at 50% 50%, #000 0%, var(--edge-hover, var(--edge)) 100%);
  opacity: 0;
}
.btn:hover::after, .btn:active::after { opacity: 1; }

.btn--white  { --edge: var(--edge-white); --edge-hover: var(--edge-white-hover); color: #fff; }
.btn--yellow { --edge: var(--edge-yellow); --edge-hover: var(--edge-yellow-hover); color: var(--yellow); }
.btn--red    { --edge: var(--edge-red); color: var(--red); }
.btn--brand  { color: #fff; flex: 1; padding: 2px; }

.btn:disabled { opacity: .24; cursor: default; pointer-events: none; }

/* ===== input ===== */
.input {
  position: relative; isolation: isolate; overflow: hidden;
  display: flex; align-items: center; gap: 16px;
  height: 64px; padding: 8px 8px 8px 16px; border-radius: 999px;
}
.input::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: radial-gradient(ellipse 72.9% 50% at 50% 50%, #000 0%, var(--edge-white) 100%);
  opacity: .16; transition: opacity .15s ease, background .15s ease;
}
.input__icon { color: var(--blue); }
.input input {
  flex: 1; min-width: 1px; background: none; border: 0; outline: none;
  font: inherit; letter-spacing: -0.06em; color: #fff;
  text-overflow: ellipsis; white-space: nowrap; caret-color: #fff;
  -webkit-user-select: text; user-select: text;
}
.input input::placeholder { color: rgba(255, 255, 255, .48); }
.input__chip { height: 48px; }
/* two chips side by side keep the 4px gap of buttons in a row (folder, info) */
.input__chip--lead { margin-right: -12px; }

.input[data-state="error"]::before {
  background: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, var(--red) 100%);
  opacity: .08;
}
.input[data-state="error"] .input__icon { color: var(--red); }
.input[data-state="error"] input { color: var(--red); }
.input[data-state="error"] .input__chip { opacity: .24; pointer-events: none; }

/* ===== layout ===== */
.stack { display: flex; flex-direction: column; gap: 12px; width: 536px; }
.row   { display: flex; gap: 4px; width: 536px; }
.row--info { gap: 4px; }
.status-text { width: 536px; color: rgba(255,255,255,.7); font-size: 13px; line-height: 18px; text-align: center; overflow-wrap: anywhere; }
.status-text[data-error="true"] { color: var(--red); }
.status-text[data-clip="true"] { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#urlInput { width: 536px; }
#folderInput, #deezerInput { flex: 1; min-width: 1px; }

/* ===== progress overlay ===== */
.progress { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
.progress svg { width: 100%; height: 100%; display: block; }
.progress path {
  fill: none; stroke: var(--yellow); stroke-width: 6;
  stroke-dasharray: 100;
  stroke-dashoffset: calc(100 - var(--p, 0));
  transition: stroke-dashoffset .25s ease;
}
.progress__glow {
  position: absolute; inset: 0; border-radius: 64px; opacity: 0;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, var(--glow-done) 100%);
  transition: opacity .3s ease;
}
.progress[hidden] { display: none; }
.progress[data-state="done"] .progress__glow { opacity: .08; }
.progress[data-state="error"] .progress__glow {
  opacity: .08;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, var(--red) 100%);
}
.progress[data-state="error"] path { stroke: none; }

/* ===== info screen ===== */
.info__text { display: flex; flex-direction: column; gap: 12px; width: 536px; text-align: center; }
.info__text p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.info__made { font-size: 14px; opacity: .24; }

/* ===== details screen (what failed and why) ===== */
.status-text[data-more="true"] { display: flex; justify-content: center; cursor: pointer; }
.status-text[data-more="true"] span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status-text[data-more="true"] span:last-child { flex-shrink: 0; white-space: pre; }
.details { display: flex; flex-direction: column; gap: 12px; width: 536px; flex: 1; min-height: 0; }
.details__summary { text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
.details__scroll {
  flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none;
  display: flex; flex-direction: column; gap: 12px;
  -webkit-user-select: text; user-select: text;
}
.details__scroll::-webkit-scrollbar { display: none; }
.details__tracks { display: flex; flex-direction: column; gap: 12px; }
.details__tracks:empty { display: none; }
.details__track p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.details__reason, .details__log { font-size: 14px; opacity: .48; }
.details__log { white-space: pre-wrap; overflow-wrap: anywhere; font: inherit; font-size: 14px; }

/* ===== window controls (frameless window has no titlebar) ===== */
.wintools { position: absolute; top: 0; left: 0; right: 0; height: 48px; z-index: 15; }
.wintools__bar {
  position: absolute; top: 20px; z-index: 16;
  display: flex; align-items: center;
}
.wintools__btn { border: 0; background: none; padding: 0; cursor: pointer; display: flex; }
.wintools__dot, .wintools__ic { display: none; }

/* macOS: traffic lights, glyphs appear on hovering the group — as in the system */
.wintools[data-os="mac"] .wintools__bar { left: 24px; gap: 8px; }
.wintools[data-os="mac"] .wintools__dot {
  display: flex; width: 12px; height: 12px; border-radius: 50%;
  align-items: center; justify-content: center;
}
.wintools__btn--close .wintools__dot { background: #FF5F57; }
.wintools__btn--min .wintools__dot { background: #FEBC2E; }
.wintools__dot svg {
  width: 12px; height: 12px; display: block;
  color: rgba(0, 0, 0, .55); opacity: 0; transition: opacity .15s ease;
}
.wintools__bar:hover .wintools__dot svg { opacity: 1; }

/* Windows / Linux: [minimize][close] on the right, DS icon style */
.wintools[data-os="win"] .wintools__bar { right: 24px; gap: 4px; flex-direction: row-reverse; }
.wintools[data-os="win"] .wintools__ic { display: inline-flex; }
.wintools__ic { color: #fff; opacity: .48; transition: opacity .15s ease, color .15s ease; }
.wintools__btn:hover .wintools__ic { opacity: 1; }
.wintools__btn--close:hover .wintools__ic { color: var(--red); }

/* Windows has close/minimize in the top right, where the (i)/(x) corner is:
   the corner takes the free top left instead, level with them */
.modal[data-os="win"] .modal__corner { top: 20px; right: auto; left: 24px; }

[hidden] { display: none !important; }
.locked { pointer-events: none; }
</style>
</head>

<script>
// Links shown on the info screen.
const LINKS = {
  github: "https://github.com/sukaslitno/wax-digger",
  x: "https://x.com/verbazilla",
  telegram: "https://t.me/insideverbes",
  donate: "https://pay.cloudtips.ru/p/2f3e88eb",
};

const ICON_INFO = document.getElementById("cornerIcon").innerHTML;
const ICON_CLOSE = `<svg viewBox="0 0 24 24" fill="none">
  <path opacity="0.5" d="M12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22Z" stroke="currentColor" stroke-width="1.5"/>
  <path d="M14.5 9.5L9.5 14.5M9.5 9.5L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
</svg>`;

// All the copy of the page is in the #strings dictionary above, one block per
// language, under keys. t() looks one up; a list value holds plural forms.
const STRINGS = JSON.parse(document.getElementById("strings").textContent);
const LANGUAGES = Object.keys(STRINGS);

// Which plural form a number takes: 0 one, 1 few (ru) / other (en), 2 many (ru).
function pluralIndex(l, n) {
  n = Math.abs(n);
  if (l === "ru") {
    if (n % 10 === 1 && n % 100 !== 11) return 0;
    if (n % 10 >= 2 && n % 10 <= 4 && !(n % 100 >= 12 && n % 100 <= 14)) return 1;
    return 2;
  }
  return n === 1 ? 0 : 1;
}

function guessLanguage() {
  const own = (navigator.languages && navigator.languages[0]) || navigator.language || "";
  return /^ru\b/i.test(own) ? "ru" : "en";
}

let lang = guessLanguage();

function t(key, vars = {}) {
  let text = (STRINGS[lang] || {})[key];
  if (text === undefined) text = STRINGS.en[key];
  if (Array.isArray(text)) text = text[Math.min(pluralIndex(lang, vars.n === undefined ? 1 : vars.n), text.length - 1)];
  return text.replace(/\{(\w+)\}/g, (m, name) => (name in vars ? vars[name] : m));
}

// A status the page wrote itself is kept as {k, v} so it follows a language
// switch; one that came from the server is plain text, in the language it had then.
const msg = (k, v) => ({ k, v });
const msgText = (m) => (typeof m === "string" ? m : t(m.k, m.v));

// Static markup carries data-i18n (text), data-i18n-placeholder and data-i18n-aria.
function applyLanguage() {
  document.documentElement.lang = lang;
  for (const node of document.querySelectorAll("[data-i18n]")) node.textContent = t(node.dataset.i18n);
  for (const node of document.querySelectorAll("[data-i18n-placeholder]")) node.placeholder = t(node.dataset.i18nPlaceholder);
  for (const node of document.querySelectorAll("[data-i18n-aria]")) node.setAttribute("aria-label", t(node.dataset.i18nAria));
}

const FORMATS = [
  ["mp3_128", "mp3 128k"],
  ["mp3_320", "mp3 320k"],
  ["flac", "flac"],
  ["wav", "wav"],
  ["aac", "aac"],
];
// YouTube links can be saved as video instead: the quality is a cap, lowest first
const VIDEO_FORMATS = [
  ["video_360", "360p"],
  ["video_480", "480p"],
  ["video_720", "720p"],
  ["video_1080", "1080p"],
  ["video_1440", "1440p"],
  ["video_2160", "2160p"],
];

const el = (id) => document.getElementById(id);
const urlEl = el("url"), folderEl = el("folder"), actionBtn = el("actionBtn");
const progressEl = el("progress"), urlInput = el("urlInput");

let fmtIndex = 1;  // mp3 320k
let videoMode = false;   // the audio / video chip; only YouTube links show it
let videoIndex = 3;      // 1080p: the best that is still H.264, which plays everywhere
let phase = "idle";      // idle | busy | done | cancelled | error
let info = false;
let details = false;     // the details screen of the last failed download(s)
let detailsLogs = null;  // their logs from the server, null while loading
let copyTimer = 0;
let copyState = "copy";  // the copy button: copy | copied | copy_failed
let urlInvalid = false;
let addFailed = false;   // the server refused the link typed while busy
// Links handed to the server, in its order; jobs[0] is the one running.
// Format and folder were fixed for each when it was added.
let jobs = [];
let batch = null;        // tally of one busy stretch: {saved, failed, cancelled, total, error, result, failedIds}
let posting = "";       // the link being handed to the server right now
let lastHeight = 0;
let doneTimer = 0;
let deezerAvailable = false;
let statusMessage = "";   // plain text from the server, or msg(key, vars) written here
let statusError = false;
let drmName = "";        // the DRM-locked service the link in the field belongs to
let revealPath = "";     // what "show in folder" opens after a finished download
let appVersion = "", ytdlpVersion = "";
let handledLink = "";    // the last link the field held: the clipboard never refills it
const seenLinks = new Set();  // links already handed to the server this session

function isSpotify(value) {
  return /^(?:open|www\.open)\.spotify\.com$/.test(hostOf(value.trim()) || "");
}

// youtube.com (shorts too) and youtu.be; music.youtube.com stays audio-only
function isYouTubeVideo(value) {
  return /^(?:youtube\.com|m\.youtube\.com|youtu\.be)$/.test(hostOf(value.trim()) || "");
}

function videoChosen() { return videoMode && isYouTubeVideo(urlEl.value); }

function availableFormats() { return isSpotify(urlEl.value) ? FORMATS.slice(0, 3) : FORMATS; }

// [backend key, chip label] of what the chips are set to for the link in the field
function chosenFormat() { return videoChosen() ? VIDEO_FORMATS[videoIndex] : FORMATS[fmtIndex]; }

// Returns the bridge call's promise, or null when running in a plain browser.
function api(name, ...args) {
  const a = window.pywebview && window.pywebview.api;
  return a && a[name] ? a[name](...args) : null;
}

function resize(h) {
  if (h === lastHeight) return;
  if (api("resize", h)) lastHeight = h;  // no bridge yet — retry on the next render
}

// A link is anything that parses as http(s) with a real domain. Whether yt-dlp
// actually supports the site can only be answered by running it.
function isLikelyUrl(value) {
  const v = value.trim();
  if (!v) return false;
  try {
    const u = new URL(/^[a-z]+:\/\//i.test(v) ? v : "https://" + v);
    if (!/^https?:$/.test(u.protocol)) return false;
    return /^[a-z0-9-]+(\.[a-z0-9-]+)*\.[a-z]{2,}$/i.test(u.hostname);
  } catch (e) { return false; }
}

// While busy the action button either adds the typed link to the queue or,
// when there is nothing new in the field, cancels the running download.
function busyAction() {
  const v = urlEl.value.trim();
  const fresh = isLikelyUrl(v) && !urlInvalid && v !== posting && !jobs.some((j) => j.url === v);
  return fresh ? "add" : "cancel";
}

function render() {
  const hasUrl = isLikelyUrl(urlEl.value);
  const hasFolder = !!folderEl.value.trim();
  const spotify = isSpotify(urlEl.value);
  const needsDeezer = spotify && !deezerAvailable;
  const action = phase === "busy" ? busyAction() : "";
  // the filled screen stays while anything runs, even with the field emptied
  const filled = hasUrl || phase !== "idle";
  if (spotify && fmtIndex > 2) fmtIndex = 0;
  el("modeChip").hidden = !isYouTubeVideo(urlEl.value);
  el("modeChip").textContent = t(videoMode ? "mode.video" : "mode.audio");
  el("fmtChip").textContent = chosenFormat()[1];

  if (details && !hasDetails()) details = false;
  const screen = info || details;  // a screen over the main one, closed by the corner (x)
  el("mainScreen").hidden = screen;
  el("folderRow").hidden = screen || !filled;
  el("deezerRow").hidden = screen || !hasUrl || !needsDeezer;
  el("deezerArl").placeholder = t(deezerAvailable ? "deezer.arl_change" : "deezer.arl");
  actionBtn.hidden = screen || !filled || !hasFolder;
  el("infoText").hidden = !info;
  el("infoRow").hidden = !info;
  el("infoMade").hidden = !info;
  el("detailsScreen").hidden = !details;
  el("copyBtn").hidden = !details;

  el("cornerIcon").innerHTML = screen ? ICON_CLOSE : ICON_INFO;
  el("cornerBtn").classList.toggle("modal__corner--close", screen);
  el("cornerBtn").setAttribute("aria-label", t(screen ? "aria.close" : "aria.info"));

  urlInput.dataset.state = urlInvalid || addFailed ? "error" : "default";
  // the link field stays open for the next link; format and folder belong to
  // the running download until a new link is typed, then to that one
  const locked = action === "cancel" || phase === "cancelled";
  el("fmtChip").classList.toggle("locked", locked);
  el("modeChip").classList.toggle("locked", locked);
  el("folderRow").classList.toggle("locked", locked);
  // pointer-events alone still leaves the focused field typeable
  folderEl.readOnly = locked;

  const waiting = phase === "cancelled";
  actionBtn.className = "btn btn--full " +
    (phase === "error" ? "btn--red" : waiting || phase === "done" || action === "cancel" ? "btn--white" : "btn--yellow");
  actionBtn.textContent =
    t(phase === "error" ? "btn.error" : waiting ? "btn.wait" : phase === "done" ? "btn.show"
    : action === "cancel" ? "btn.cancel" : action === "add" ? "btn.add"
    : videoChosen() ? "btn.grab_video" : "btn.grab");
  actionBtn.disabled = waiting || !!posting ||
    (action === "cancel" ? !jobs.length || jobs[0].cancelling : urlInvalid || needsDeezer);
  const queued = phase === "busy" ? jobs.length - 1 : 0;
  // a link that cannot work says why, until a download has something to report
  const drm = urlInvalid && phase !== "busy" ? drmMessage(drmName) : "";
  const shown = msgText(statusMessage);
  const status = drm || (shown && queued > 0 ? `${shown} · ${t("st.queued", { n: queued })}` : shown);
  // a failed or partial download offers its details right on the status line
  const more = !drm && hasDetails();
  el("downloadStatus").hidden = screen || !status;
  el("statusMsg").textContent = status;
  el("statusMore").textContent = more ? t("details.more") : "";
  el("downloadStatus").dataset.more = String(more);
  el("downloadStatus").tabIndex = more ? 0 : -1;
  el("downloadStatus").dataset.error = String(!!drm || statusError);
  el("downloadStatus").dataset.clip = String(phase === "done");
  el("infoMade").textContent = [t("made"), appVersion && "v" + appVersion,
    ytdlpVersion && "yt-dlp " + ytdlpVersion].filter(Boolean).join(" · ");
  el("langBtn").textContent = lang;
  el("copyBtn").textContent = t(copyState);

  progressEl.hidden = screen || phase === "idle";

  resize(details ? 558 : info ? 396 : (!filled ? 260 : !hasFolder ? 336 : 432) + (hasUrl && needsDeezer ? 76 : 0) + (status ? 50 : 0));
}

function setProgress(pct) {
  progressEl.style.setProperty("--p", Math.max(0, Math.min(100, pct)));
}

// ===== format chips =====
el("fmtChip").addEventListener("click", () => {
  edited();
  if (videoChosen()) videoIndex = (videoIndex + 1) % VIDEO_FORMATS.length;
  else fmtIndex = (fmtIndex + 1) % availableFormats().length;
  el("fmtChip").textContent = chosenFormat()[1];
});
// audio / video: each keeps its own choice, so switching back loses nothing
el("modeChip").addEventListener("click", () => {
  edited();
  videoMode = !videoMode;
  render();
});

// ===== folder =====
async function loadFolder() {
  try {
    const d = await (await fetch("/get-folder")).json();
    folderEl.value = d.path || "";
  } catch (e) {}
  render();
}

async function loadStatus() {
  try {
    const d = await (await fetch("/status")).json();
    appVersion = d.version || "";
    ytdlpVersion = d.ytdlp_version || "";
  } catch (e) {}
  render();
}

async function loadDeezer() {
  try { deezerAvailable = (await (await fetch("/deezer-session")).json()).available; } catch (e) {}
  render();
}
el("connectDeezer").addEventListener("click", async () => {
  try {
    const response = await fetch("/deezer-session", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({arl:el("deezerArl").value})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.error);
    deezerAvailable = true;
    el("deezerArl").value = "";
    statusMessage = msg("deezer.added");
    statusError = false;
  } catch (e) { statusMessage = e.message; statusError = true; }
  render();
});

el("browseBtn").addEventListener("click", async () => {
  edited();
  const d = await (await fetch("/choose-folder", { method: "POST" })).json();
  if (d.path) folderEl.value = d.path;
  render();
});

// ===== download =====
// The server turns both yt-dlp and the Deezer adapter into the same events:
// status / progress {percent, message} / error {message} / result {saved, failed, total}.
const savedMsg = (r) => msg("st.saved_n", { saved: r.saved, total: r.total });

// Hand the link in the field to the server. The first one starts a busy
// stretch; while busy, each further one waits its turn there.
async function enqueue() {
  const url = urlEl.value.trim();
  const first = phase !== "busy";
  if (first) {
    phase = "busy";
    jobs = [];
    batch = { saved: 0, failed: 0, cancelled: 0, total: 0, error: "", result: null, folder: "", failedIds: [] };
    statusMessage = msg(isSpotify(url) ? "st.connecting" : "st.starting");
    statusError = false;
    progressEl.dataset.state = "";
    setProgress(0);
  }
  posting = url;
  render();

  let stream_id, error;
  try {
    const r = await fetch("/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, format: chosenFormat()[0], output_path: folderEl.value.trim() }),
    });
    ({ stream_id, error } = await r.json());
  } catch (e) { error = String(e); }
  posting = "";

  if (error || !stream_id) {
    if (first) { fail(error); return; }
    // the running ones go on; the field shows this link could not be added
    console.error("[wax]", error);
    addFailed = true;
    if (!jobs.length) settle();  // the running one ended while this was refused
    else render();
    return;
  }
  seenLinks.add(url);
  jobs.push({ id: stream_id, url, out: folderEl.value.trim() });
  if (!first && urlEl.value.trim() === url) { urlEl.value = ""; validate(); }
  if (jobs.length === 1) follow(jobs[0]);
  render();
}

// Read the running download's stream; when it ends, move on to the next one.
function follow(job) {
  statusMessage = msg(isSpotify(job.url) ? "st.connecting" : "st.starting");
  statusError = false;
  setProgress(0);
  let result = null, errorMessage = "";
  const es = new EventSource("/progress/" + job.id);
  es.onmessage = (e) => {
    const data = e.data;
    if (data.startsWith("__DONE__:")) {
      es.close();
      finished(job, data.slice(9), result, errorMessage);
      return;
    }
    if (!data.startsWith("__WAX__:")) return;
    try {
      const event = JSON.parse(data.slice(8));
      if (!job.cancelling && (event.type === "status" || event.type === "progress")) statusMessage = event.message;
      if (event.type === "progress" && !job.cancelling) setProgress(event.percent);
      if (event.type === "error") {
        errorMessage = event.message;
        if (event.code === "go.connect") deezerAvailable = false;
      }
      if (event.type === "result") result = event;
      render();
    } catch (e) {}
  };
  es.onerror = () => {
    es.close();
    if (phase === "busy" && jobs[0] === job) { jobs = []; fail(msg("st.lost")); }
  };
}

function finished(job, how, result, errorMessage) {
  if (jobs[0] !== job) return;
  jobs.shift();
  batch.total++;
  batch.folder = job.out;
  if (how !== "cancelled") batch.result = result;
  if (how === "done") batch.saved++;
  else if (how === "cancelled") batch.cancelled++;
  else {
    batch.failed++;
    batch.failedIds.push(job.id);
    // a playlist that saved some tracks reports how many, not the first error
    batch.error = result && result.saved > 0 ? savedMsg(result) : errorMessage;
  }
  if (jobs.length) { follow(jobs[0]); render(); return; }
  if (posting) { render(); return; }  // a link is on its way in; it picks up from here
  settle();
}

// The queue is empty: sum up the busy stretch the way a single link did.
function settle() {
  const counted = batch.total - batch.cancelled;
  if (counted === 0) { cancelled(); return; }
  if (batch.failed === 0) succeed(counted === 1 ? batch.result : null, counted);
  else if (counted === 1 || batch.saved === 0) fail(batch.error);
  else fail(msg("st.links_saved", { saved: batch.saved, n: counted }));
}

async function cancelCurrent() {
  const job = jobs[0];
  if (!job || job.cancelling) return;
  job.cancelling = true;
  statusMessage = msg("st.cancelling");
  statusError = false;
  render();
  try { await fetch("/cancel/" + job.id, { method: "POST" }); } catch (e) {}
  // the stream itself ends with __DONE__:cancelled (or finished just before)
}

function fileName(path) { return String(path).split(/[\\/]/).pop(); }

// Stays on screen, with "show in folder", until the field is touched or the
// button is used. A single file is named; an album or playlist opens its own
// folder; several links open the output folder.
function succeed(result, links = 1) {
  const paths = (links === 1 && result && result.paths) || [];
  const single = paths.length === 1 && result.total === 1;
  phase = "done";
  statusMessage = links > 1 ? msg("st.links_saved", { saved: links, n: links })
    : result && result.total > 1 ? savedMsg(result)
    : single ? fileName(paths[0]) : msg("st.saved");
  revealPath = single ? paths[0] : (links === 1 && result && result.folder) || batch.folder;
  setProgress(100);
  progressEl.dataset.state = "done";
  render();
}

function cancelled() {
  phase = "cancelled";
  statusMessage = msg("st.cancelled");
  statusError = false;
  setProgress(0);
  progressEl.dataset.state = "";
  render();
  doneTimer = setTimeout(reset, 1500);
}

function reset() {
  clearTimeout(doneTimer);
  details = false;
  phase = "idle";
  jobs = [];
  statusMessage = "";
  statusError = false;
  progressEl.dataset.state = "";
  setProgress(0);
  render();
}

function fail(reason) {
  if (reason) console.error("[wax]", msgText(reason));
  phase = "error";
  statusMessage = reason || msg("err.generic");
  statusError = true;
  progressEl.dataset.state = "error";
  render();
}

actionBtn.addEventListener("click", () => {
  if (posting) return;
  if (phase === "error") { reset(); return; }
  if (phase === "done") {
    if (revealPath) api("reveal", revealPath);
    reset();
    return;
  }
  if (phase === "busy") {
    if (busyAction() === "cancel") cancelCurrent();
    else if (!urlInvalid && folderEl.value.trim()) enqueue();
    return;
  }
  if (phase === "idle" && !urlInvalid && isLikelyUrl(urlEl.value) && folderEl.value.trim()) enqueue();
});

// ===== details screen =====
// Only after an error (a partial album counts) of a download the server ran.
function hasDetails() {
  return phase === "error" && !!batch && batch.failedIds.length > 0;
}

async function openDetails() {
  if (!hasDetails()) return;
  info = false;
  details = true;
  detailsLogs = null;
  showDetails();
  render();
  const ids = batch.failedIds.slice();
  const logs = await Promise.all(ids.map(async (id) => {
    try {
      const r = await fetch("/log/" + id);
      return r.ok ? await r.json() : null;
    } catch (e) { return null; }
  }));
  if (!details || ids.join() !== batch.failedIds.join()) return;  // closed or replaced meanwhile
  detailsLogs = logs.filter(Boolean);
  showDetails();
}

function trackName(track) {
  if (!track.title && !track.artist && track.count) return t("tracks", { n: track.count });
  return track.artist && track.title ? `${track.artist} — ${track.title}` : track.title || track.artist || "";
}

// One summary line, then each track that failed (or was skipped) and why.
function detailsModel() {
  const logs = detailsLogs || [];
  let summary = msgText(statusMessage);
  if (logs.length === 1) {
    const r = logs[0].result;
    if (r && r.total > 1) {
      summary = t("st.saved_n", { saved: r.saved, total: r.total }) + (r.skipped ? ` · ${t("already", { n: r.skipped })}` : "");
    } else if (logs[0].message) summary = logs[0].message;
  }
  const items = [];
  for (const log of logs) {
    const tracks = log.failures.concat(log.skipped);
    // several links: one with no per-track list is named by its link
    if (!tracks.length && logs.length > 1) items.push({ name: log.url, reason: log.message });
    for (const track of tracks) items.push({ name: trackName(track), reason: track.reason, detail: track.detail || "" });
  }
  const lines = [];
  for (const log of logs) {
    if (logs.length > 1) lines.push(log.url);
    if (log.dropped) lines.push(t("earlier", { n: log.dropped }));
    lines.push(...log.lines);
  }
  return { summary, items, lines };
}

function showDetails() {
  const tracks = el("detailsTracks");
  tracks.textContent = "";
  if (detailsLogs === null) {
    el("detailsSummary").textContent = msgText(statusMessage);
    el("detailsLog").textContent = t("loading");
    return;
  }
  const m = detailsModel();
  el("detailsSummary").textContent = m.summary;
  for (const item of m.items) {
    const row = document.createElement("div");
    row.className = "details__track";
    const name = document.createElement("p");
    name.textContent = item.name;
    name.title = item.name;
    const reason = document.createElement("p");
    reason.className = "details__reason";
    reason.textContent = item.reason;
    row.append(name, reason);
    tracks.append(row);
  }
  el("detailsLog").textContent = detailsLogs.length ? m.lines.join("\n") : t("gone");
  el("detailsScroll").scrollTop = 0;
}

// Plain text of the details for a bug report: versions, links, failures, log.
function detailsText() {
  const m = detailsModel();
  const head = ["wax " + (appVersion || "?"), ytdlpVersion && "yt-dlp " + ytdlpVersion].filter(Boolean).join(" · ");
  const links = (detailsLogs || []).map((l) => `${l.url} (${l.source}, ${l.format})`);
  const items = m.items.map((i) => `${i.name}: ${i.reason}${i.detail ? ` (${i.detail})` : ""}`);
  return [head, ...links, m.summary, "", ...items, items.length ? "" : null, ...m.lines]
    .filter((l) => l !== null).join("\n");
}

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {}
  try { return !!(await api("copy_text", text)); } catch (e) { return false; }
}

el("downloadStatus").addEventListener("click", () => { if (hasDetails()) openDetails(); });
el("downloadStatus").addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && hasDetails()) { e.preventDefault(); openDetails(); }
});

el("copyBtn").addEventListener("click", async () => {
  const ok = await copyText(detailsText());
  clearTimeout(copyTimer);
  copyState = ok ? "copied" : "copy_failed";
  render();
  copyTimer = setTimeout(() => { copyState = "copy"; render(); }, 1500);
});

// ===== info screen =====
el("cornerBtn").addEventListener("click", () => {
  if (details) { details = false; render(); return; }
  info = !info;
  if (info) loadStatus();
  render();
});

// ===== language =====
// The switch is the white button at the end of the info row.
// The server speaks the same language (its own messages), and keeps a switch
// the user made in the settings; a guess from the system is not kept.
function setLanguage(code, save) {
  if (!LANGUAGES.includes(code)) return;
  lang = code;
  applyLanguage();
  if (details) showDetails();
  render();
  fetch("/language", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ language: code, save }),
  }).catch(() => {});
}

async function loadLanguage() {
  try {
    const d = await (await fetch("/language")).json();
    setLanguage(d.saved ? d.language : guessLanguage(), false);
  } catch (e) {}
}

// shows the language in use, like the format chip shows its format; a click switches to the other
el("langBtn").addEventListener("click", () => setLanguage(LANGUAGES[(LANGUAGES.indexOf(lang) + 1) % LANGUAGES.length], true));

el("infoRow").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-link]");
  if (!btn) return;
  const href = LINKS[btn.dataset.link];
  if (!href) return;
  if (!api("open_url", href)) window.open(href, "_blank");
});

document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (info || details) { info = details = false; render(); return; }
  api("close_window");
});

// ===== URL validation (DRM-only services have no yt-dlp extractor) =====
const UNSUPPORTED = [
  [/(^|\.)music\.apple\.com$/, "apple music"], [/(^|\.)itunes\.apple\.com$/, "itunes"],
  [/(^|\.)deezer\.com$/, "deezer"], [/(^|\.)tidal\.com$/, "tidal"], [/music\.amazon\./, "amazon music"],
  [/(^|\.)pandora\.com$/, "pandora"], [/(^|\.)qobuz\.com$/, "qobuz"], [/(^|\.)napster\.com$/, "napster"],
  [/(^|\.)audible\.com$/, "audible"], [/(^|\.)shazam\.com$/, "shazam"],
];

// The service a host belongs to if it is DRM-locked, else "".
function drmService(host) {
  const hit = host && UNSUPPORTED.find(([re]) => re.test(host));
  return hit ? hit[1] : "";
}

function drmMessage(name) { return t("drm", { name }); }

function hostOf(value) {
  try {
    const u = /^[a-z]+:\/\//i.test(value) ? value : "https://" + value;
    return new URL(u).hostname.replace(/^www\./, "").toLowerCase();
  } catch (e) { return null; }
}

function validate() {
  drmName = drmService(hostOf(urlEl.value.trim()));
  urlInvalid = !!drmName;
}

function edited() {
  addFailed = false;
  if (phase === "error" || phase === "done" || phase === "cancelled") reset();
}

urlEl.addEventListener("input", () => {
  const v = urlEl.value.trim();
  if (v) handledLink = v;
  edited(); validate(); render();
});
folderEl.addEventListener("input", () => { edited(); render(); });
// Enter adds or grabs, but never cancels a download by accident
urlEl.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || actionBtn.disabled || actionBtn.hidden || phase === "done") return;
  if (phase === "busy" && busyAction() === "cancel") return;
  actionBtn.click();
});

// ===== a link from outside: dropped on the window, or waiting on the clipboard =====
function setUrl(link) {
  info = false;
  details = false;
  urlEl.value = link;
  handledLink = link;
  edited(); validate(); render();
  urlEl.focus();
}

// The link in a drop: the first uri-list entry, else the plain text, if it is a link.
function linkFromDrop(uriList, plain) {
  const first = (text) => (text || "").split(/\r?\n/).map((l) => l.trim()).find((l) => l && !l.startsWith("#")) || "";
  const link = first(uriList) || first(plain);
  return isLikelyUrl(link) ? link : "";
}

// Without these the webview would navigate away to whatever was dropped.
window.addEventListener("dragenter", (e) => e.preventDefault());
window.addEventListener("dragover", (e) => {
  e.preventDefault();
  if (e.dataTransfer) e.dataTransfer.dropEffect = "copy";
});
window.addEventListener("drop", (e) => {
  e.preventDefault();
  const dt = e.dataTransfer;
  const link = dt && linkFromDrop(dt.getData("text/uri-list"), dt.getData("text/plain"));
  if (link) setUrl(link);
});

// When the window opens or gains focus with nothing typed, offer a copied link.
// It only fills the field; starting is the user's call.
let prefilling = false;
async function prefillFromClipboard() {
  if (prefilling || phase !== "idle" || urlEl.value.trim()) return;
  prefilling = true;
  try {
    const link = await api("clipboard_url");
    if (link && link !== handledLink && !seenLinks.has(link) && phase === "idle" && !urlEl.value.trim()) setUrl(link);
  } catch (e) {} finally { prefilling = false; }
}
window.addEventListener("focus", prefillFromClipboard);

// ===== window controls: close/minimize, always in sight =====
// (they used to show only on hovering the top edge, and closing was a riddle)
const winTools = el("winTools");
el("winClose").addEventListener("click", () => api("close_window"));
el("winMin").addEventListener("click", () => api("minimize"));

// The look follows the OS, asked from the bridge — a browser dev session has
// none, and there the strip stays hidden (the tab has its own controls).
async function initTools() {
  try {
    const os = await api("platform");
    winTools.dataset.os = el("modal").dataset.os = os === "darwin" ? "mac" : "win";
    winTools.hidden = false;
  } catch (e) {}
  render();
  prefillFromClipboard();
}

window.addEventListener("pywebviewready", initTools);
if (window.pywebview) initTools();  // in case the bridge landed before this ran

applyLanguage();
loadLanguage();
loadFolder();
loadDeezer();
loadStatus();
urlEl.focus();
</script>
</body>
</html>
