name: Build & Release extension

# Pushes a packaged build to a GitHub Release whenever you tag a version, e.g.:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Chrome/Chromium users grab wax-digger-chrome.zip and "Load unpacked".
# Firefox users get a signed .xpi (one-click, permanent) IF you set the two
# AMO secrets below; otherwise an unsigned firefox zip is attached instead.
#
# Optional repo secrets (Settings → Secrets and variables → Actions):
#   AMO_JWT_ISSUER  — from https://addons.mozilla.org/developers/addon/api/key/
#   AMO_JWT_SECRET  —  "

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: ytdlp-extension

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_AMO: ${{ secrets.AMO_JWT_ISSUER != '' && secrets.AMO_JWT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build packages
        run: node build.js

      - name: Sign Firefox add-on (if AMO secrets present)
        id: sign
        if: env.HAS_AMO == 'true'
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext sign \
            --source-dir dist/firefox \
            --artifacts-dir dist/signed \
            --channel unlisted \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp dist/wax-digger-chrome.zip out/
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp dist/signed/*.xpi out/wax-digger-firefox.xpi
          else
            cp dist/wax-digger-firefox.zip out/
          fi
          ls -la out

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ytdlp-extension/out/*
          generate_release_notes: true
          body: |
            ## Install

            **Chrome / Edge / Brave / Opera / Vivaldi / Arc**
            1. Download `wax-digger-chrome.zip` and unzip it.
            2. Open `chrome://extensions`, enable **Developer mode**.
            3. **Load unpacked** → select the unzipped folder.

            **Firefox**
            - If a `.xpi` is attached: click it in Firefox to install (permanent).
            - Otherwise enable temporarily via `about:debugging` → *Load Temporary Add-on*.

            The local **YTDLP GUI** server must be running for downloads to work.
