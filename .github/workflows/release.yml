name: Build & Release

# On a version tag (git tag v1.0.0 && git push origin v1.0.0) this builds:
#   - WaxDigger.dmg   (macOS, self-contained: bundles yt-dlp + ffmpeg)
#   - WaxDigger.exe   (Windows portable, self-contained)
# and attaches them all to a single GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- macOS .dmg ----------------
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gofi/go.mod
      - run: pip install pyinstaller pillow flask pywebview
      - name: Build DMG
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/WaxDigger.dmg

  # ---------------- Windows .exe ----------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-go@v5
        with:
          go-version-file: vendor/gofi/go.mod
      - run: pip install pyinstaller pillow flask pywebview
      - name: Build EXE
        shell: pwsh
        run: packaging/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/WaxDigger.exe

  # ---------------- publish release ----------------
  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File | Notes |
            | --- | --- | --- |
            | **macOS** | `WaxDigger.dmg` | Open the DMG, drag **Wax Digger** to Applications. First launch: right-click → Open (unsigned). |
            | **Windows** | `WaxDigger.exe` | Portable — just double-click. SmartScreen → More info → Run anyway (unsigned). |

            The desktop app bundles **yt-dlp + ffmpeg** — nothing else to install.
