<!-- DM Mono has no Cyrillic: Russian letters fall back to JetBrains Mono, same as in the app -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:ital@0;1&family=JetBrains+Mono:ital@0;1&display=swap">
<style>
:root {
  --black: #000;
  --white: #fff;
  --blue: #68d0ed;
  --yellow: #d9ef71;
  --red: #ff4c4d;
  --card: #0e0e0e;
  --gutter: 24px;
  --font: 'DM Mono', 'JetBrains Mono', ui-monospace, monospace;

  /* Button fills from the design: an elliptical radial gradient at 55% */
  --g-gray:   radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(106,106,106,.55));
  --g-blue:   radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(14,74,89,.55));
  --g-yellow: radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(111,123,57,.55));
  --g-github: radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(104,128,237,.55));
  --g-tg:     radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(131,195,255,.55));
  --g-donate: radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.55), rgba(85,191,112,.55));
  --g-input:  radial-gradient(ellipse 72.9% 50% at 50% 50%, rgba(0,0,0,.16), rgba(106,106,106,.16));
}

*, *::before, *::after { box-sizing: border-box; }
html { color-scheme: dark; -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--black);
  color: var(--white);
  font: 400 16px/normal var(--font);
  letter-spacing: -0.06em;
  overflow-x: clip;
  -webkit-font-smoothing: antialiased;
}
p { margin: 0; }
a { color: inherit; text-decoration: none; }
button { font: inherit; letter-spacing: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
img { display: block; }

/* ---------- pill button ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  height: 48px;
  padding: 2px 16px;
  border-radius: 999px;
  overflow: hidden;
  white-space: nowrap;
  background: var(--g-gray);
  transition: filter .18s ease, transform .12s ease;
  -webkit-tap-highlight-color: transparent;
}
.pill:hover { filter: brightness(1.35); }
.pill:active { transform: scale(.97); }
.pill:focus-visible { outline: 2px solid var(--blue); outline-offset: 3px; }
.pill--blue { background: var(--g-blue); color: var(--blue); }
.pill--sq { width: 48px; padding: 2px; }

/* 24px icon slot; the image keeps the in-frame offset it has in the design */
.ic { display: block; position: relative; flex: none; width: 24px; height: 24px; }
.ic img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.ic--github img { left: 0; top: 9.375%; width: 84.375%; height: 84.375%; }
.ic--inset img { left: 5.208%; top: 5.208%; width: 89.583%; height: 89.583%; }
.ic--donate img { left: 5.208%; top: 17.708%; width: 89.583%; height: 64.583%; }

/* ---------- layout ---------- */
.nav {
  width: min(1040px, 100% - 2 * var(--gutter));
  margin: 0 auto;
  padding-top: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.nav__logo { width: 128.64px; height: 48px; }
.nav__logo img { width: 100%; height: 100%; object-fit: cover; }
.nav__actions { display: flex; gap: 8px; align-items: center; }

.col { width: min(611px, 100% - 2 * var(--gutter)); margin: 0 auto; text-align: center; }

.hero { margin-top: 100px; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.hero__title { font-size: 32px; }
.hero__sub { font-size: 24px; font-style: italic; opacity: .48; }
.c-blue { color: var(--blue); } .c-yellow { color: var(--yellow); } .c-red { color: var(--red); }
.ast { color: var(--red); font-size: .645em; position: relative; top: -.42em; margin-left: .04em; }
.br-m { display: none; }

/* wax illustration — wider than the viewport, like in the design */
.art {
  position: relative;
  width: min(100vw + 49px, 1489px);
  aspect-ratio: 1489 / 562;
  margin: 99px 0 0 50%;
  transform: translateX(-50%);
  pointer-events: none;
  user-select: none;
  container-type: inline-size;
}
/* each letter: slot (rise-in) > sway (idle motion) > box (Figma orientation) */
.art__slot { position: absolute; aspect-ratio: 1; animation: rise 1.7s cubic-bezier(.22,1,.36,1) both; }
.art__slot--w { left: 0; top: .071%; width: 37.69%; animation-delay: .15s; }
.art__slot--a { left: 31.659%; top: .071%; width: 37.69%; animation-delay: .3s; }
.art__slot--x { left: 64.638%; top: 3.566%; width: 35.051%; animation-delay: .45s; }
/* opacity lives on the leaves, so no ancestor of the glass becomes a backdrop root */
.art__slot img, .art__glass { animation: appear 1.1s ease-out both; animation-delay: inherit; }
.art__sway, .art__box { position: absolute; inset: 0; }
.art__sway { animation: bob 4.2s ease-in-out 1.6s infinite alternate both, tilt 5.6s ease-in-out 1.6s infinite alternate both; }
.art__slot--a .art__sway { animation-duration: 5s, 6.4s; animation-delay: 1.9s, 1.9s; }
.art__slot--x .art__sway { animation-duration: 3.8s, 5.2s; animation-delay: 2.2s, 2.2s; animation-direction: alternate-reverse; }
@keyframes rise { from { translate: 0 42%; } }
@keyframes appear { from { opacity: 0; } }
@keyframes bob { from { translate: 0 -4.5%; } to { translate: 0 4.5%; } }
@keyframes tilt { from { rotate: -5deg; } to { rotate: 5deg; } }

.art__w { transform: rotate(-90deg); }
.art__w img { position: absolute; left: 7.61%; top: 0; width: 84.89%; height: 100%; }
.art__a { transform: scaleY(-1); }
.art__a img, .art__glass { position: absolute; left: 0; top: 3.5%; width: 100%; height: 93%; }
/* the middle shape is frosted glass over the w and the x (Figma background blur) */
.art__glass {
  -webkit-backdrop-filter: blur(4.2cqw) saturate(1.4) brightness(1.3);
  backdrop-filter: blur(4.2cqw) saturate(1.4) brightness(1.3);
  -webkit-mask: url(/assets/img/a-shape.svg) center / 100% 100% no-repeat;
  mask: url(/assets/img/a-shape.svg) center / 100% 100% no-repeat;
}
.art__x .art__box img, .art__slot--x img { width: 100%; height: 100%; }

/* app window mock — everything in em, scaled to the card width (600px = 1em·37.5) */
.mock-wrap { position: relative; z-index: 1; width: min(860px, 100% - 2 * var(--gutter)); margin: 100px auto 0; container-type: inline-size; pointer-events: none; }
.mock {
  font-size: calc(100cqw * 16 / 600);
  background: var(--card);
  border-radius: 4em;
  padding: 2em;
  display: flex;
  flex-direction: column;
  gap: 2em;
  overflow: hidden;
  user-select: none;
  position: relative;
}
/* progress: the app's yellow outline running clockwise from the top, then the done glow */
.m-progress { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; transition: opacity .4s ease; z-index: 2; }
.m-progress path { fill: none; stroke: var(--yellow); stroke-width: 6; stroke-dasharray: 100; stroke-dashoffset: calc(100 - var(--p, 0)); }
.m-glow { position: absolute; inset: 0; border-radius: inherit; opacity: 0; transition: opacity .5s ease;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, #000 0%, #cce168 100%); }
.mock[data-phase="busy"] .m-progress, .mock[data-phase="done"] .m-progress { opacity: 1; }
.mock[data-phase="done"] .m-glow { opacity: .08; }
.ph { opacity: .32; }
.caret { display: inline-block; width: .08em; height: 1.15em; margin: 0 .02em; vertical-align: -.2em; background: var(--white); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.m-chip { transition: opacity .3s ease, transform .3s cubic-bezier(.22,1,.36,1); }
.m-chip[data-hidden="true"] { opacity: 0; transform: scale(.85); }
.m-chip.pop { animation: pop-chip .32s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop-chip { 40% { transform: scale(1.12); filter: brightness(1.5); } }
.m-btn--grab { transition: opacity .3s ease, transform .15s ease; }
.m-btn--grab[data-state="off"] { opacity: .24; }
.m-btn--grab[data-state="white"] { background: var(--g-gray); color: var(--white); }
.m-btn--grab.press { transform: scale(.97); filter: brightness(1.4); }
.m-fade { transition: opacity .4s ease; }
.mock[data-clearing="true"] .m-fade { opacity: 0; }
.mock__rows { display: flex; flex-direction: column; gap: .75em; }
.mock__row { display: flex; gap: .25em; }
.m-input {
  display: flex; align-items: center; gap: 1em;
  height: 4em; padding: .5em .5em .5em 1em;
  border-radius: 999em; background: var(--g-input); min-width: 0;
}
.m-input--full { width: 100%; }
.m-input--path { width: 26.94em; flex: none; }
.m-input .ic { width: 1.5em; height: 1.5em; }
.m-input__text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
.m-btn {
  display: flex; align-items: center; justify-content: center;
  padding: .125em 1.5em; border-radius: 999em; background: var(--g-gray);
  white-space: nowrap; flex: none;
}
.m-input .m-btn { height: 100%; }
.m-btn--browse { height: 4em; flex: 1; }
.m-btn--grab { height: 4em; width: 100%; background: var(--g-yellow); color: var(--yellow); }

.get { margin-top: 100px; display: flex; flex-direction: column; gap: 24px; align-items: center; }
.get__title { font-size: 32px; }
.get__btn { width: 100%; height: 100px; font-size: 24px; }

.social { margin-top: 100px; display: flex; flex-direction: column; gap: 24px; }
.social__title { font-size: 24px; }
.social__row { display: flex; gap: 4px; }
.social__row .pill { flex: 1 0 0; min-width: 0; height: 64px; padding: 2px 24px; }
.pill--github { background: var(--g-github); }
.pill--tg { background: var(--g-tg); }
.pill--donate { background: var(--g-donate); }

.foot { margin: 99px auto 0; padding-bottom: 40px; font-style: italic; opacity: .32; }

/* ---------- modal ---------- */
.modal {
  width: min(600px, 100% - 2 * var(--gutter));
  max-width: none;
  padding: 32px;
  border: 0;
  border-radius: 48px;
  background: var(--black);
  color: var(--white);
  overflow: hidden;
}
.modal::backdrop { background: rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.modal[open] { animation: pop .22s cubic-bezier(.2,.9,.3,1.15); }
.modal[open]::backdrop { animation: fade .2s ease; }
@keyframes pop { from { opacity: 0; transform: scale(.94) translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
.modal__inner { display: flex; flex-direction: column; gap: 32px; }
.modal__title { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 32px; }
.modal__close { position: absolute; top: 32px; right: 32px; width: 24px; height: 24px; border-radius: 50%; transition: opacity .18s; }
.modal__close:hover { opacity: .7; }
.modal__close:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.modal__close .ic { pointer-events: none; }
.modal__note { display: none; color: var(--red); font-size: 14px; font-style: italic; text-align: center; }
.modal__row { display: flex; gap: 4px; }
.modal__row .pill { flex: 1 0 0; min-width: 0; height: 64px; padding: 2px 24px; }

@media (prefers-reduced-motion: reduce) {
  .modal[open], .modal[open]::backdrop { animation: none; }
  .pill { transition: none; }
  .art__slot, .art__slot img, .art__glass, .art__sway { animation: none; }
}

/* ---------- mobile ---------- */
@media (max-width: 640px) {
  .hero { margin-top: 64px; }
  .hero__title { font-size: 24px; }
  .hero__sub { font-size: 16px; }
  .br-d { display: none; }
  .br-m { display: inline; }
  .art { margin-top: 45px; }
  .mock-wrap { margin-top: 64px; }
  .mock { border-radius: 4em; }
  .get { margin-top: 64px; gap: 16px; }
  .get__title { font-size: 24px; }
  .social { margin-top: 63px; }
  .social__title, .get__title { white-space: nowrap; font-size: min(24px, (100vw - 48px) / (var(--n, 26) * .55)); }
  .foot { margin-top: 63px; padding-bottom: 64px; }

  .modal { padding: 24px; border-radius: 32px; }
  .modal__inner { gap: 16px; }
  .modal__note { display: block; }
  .modal__close { top: 24px; right: 24px; }
  .modal__row { flex-direction: column; }
  .modal__row .pill { flex: none; width: 100%; }
}
</style>
</head>

<script>
(() => {
  const WAX = '<span class="c-blue">w</span><span class="c-yellow">a</span><span class="c-red">x</span>';
  const STRINGS = {
    ru: {
      "doc.title": "wax — скачать любой трек или плейлист",
      "hero.title": `${WAX} позволит скачать <br class="br-m">любой<span class="ast">*</span> трек <br class="br-d">или плейлист <br class="br-m">в два клика`,
      "hero.sub": "(полностью локально и бесплатно)",
      "nav.download": "скачать",
      "get.title": "доступно на мак и винду",
      "get.btn": "скачать wax",
      "social.title": "другие проекты и соц.сети:",
      "modal.title": "выбери платформу:",
      "modal.note": "на тилибоне нет..., но скачать можно",
      "aria.lang": "switch to english",
      "aria.close": "закрыть",
      "aria.donate": "поддержать",
      "app.url": "ссылка на трек / альбом / плейлист",
      "app.folder": "куда сохранять",
      "app.browse": "выбрать",
      "app.grab": "хватай трек",
      "app.cancel": "стоп",
      "app.show": "показать в папке",
    },
    en: {
      "doc.title": "wax — download any track or playlist",
      "hero.title": `${WAX} lets you download <br class="br-m">any<span class="ast">*</span> track <br class="br-d">or playlist <br class="br-m">in two clicks`,
      "hero.sub": "(fully local and free)",
      "nav.download": "download",
      "get.title": "available on mac and windows",
      "get.btn": "download wax",
      "social.title": "other projects and socials:",
      "modal.title": "choose your platform:",
      "modal.note": "not on phones..., but you can download",
      "aria.lang": "переключить на русский",
      "aria.close": "close",
      "aria.donate": "donate",
      "app.url": "paste a track / album / playlist link",
      "app.folder": "output folder",
      "app.browse": "browse",
      "app.grab": "grab the wax",
      "app.cancel": "cancel",
      "app.show": "show in folder",
    },
  };

  const store = {
    get() { try { return localStorage.getItem("wax-lang"); } catch { return null; } },
    set(v) { try { localStorage.setItem("wax-lang", v); } catch {} },
  };

  function pickLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (q && STRINGS[q]) return q;
    const saved = store.get();
    if (saved && STRINGS[saved]) return saved;
    return (navigator.languages || [navigator.language || ""]).some(l => /^(ru|uk|be|kk)\b/i.test(l)) ? "ru" : "en";
  }

  let lang = pickLang();
  const langBtn = document.getElementById("langBtn");

  function apply() {
    const t = STRINGS[lang];
    document.documentElement.lang = lang;
    document.title = t["doc.title"];
    document.querySelectorAll("[data-i18n]").forEach(n => { n.textContent = t[n.dataset.i18n]; });
    // one-line mobile titles shrink to fit their character count
    document.querySelectorAll(".get__title, .social__title").forEach(n => n.style.setProperty("--n", n.textContent.length));
    document.querySelectorAll("[data-i18n-html]").forEach(n => { n.innerHTML = t[n.dataset.i18nHtml]; });
    document.querySelectorAll("[data-i18n-aria]").forEach(n => { n.setAttribute("aria-label", t[n.dataset.i18nAria]); });
    langBtn.textContent = lang;
    renderMock();
  }

  langBtn.addEventListener("click", () => {
    lang = lang === "ru" ? "en" : "ru";
    store.set(lang);
    const url = new URL(location.href);
    url.searchParams.set("lang", lang);
    history.replaceState(null, "", url);
    apply();
  });

  // ---- app demo: a link goes in, a folder fills, the download runs, all by itself ----
  const LINK = "https://open.spotify.com/album/0DtvntV6nxS2sWdtjBgDcL?si=g3EV24eeRdqr3otth8xCOQ";
  const PATHS = ["~/Music/wax", "~/Desktop/digs", "~/Music/vinyl", "~/Downloads/crate", "D:\\music\\wax", "~/Music/fresh cuts"];
  const mock = document.getElementById("mock");
  const FMTS = ["mp3 128k", "mp3 320k", "flac"];  // what the app offers for a spotify link
  const M = { url: "", path: "", caret: "", chip: false, fmt: 0, action: "off", phase: "idle" };
  const $ = id => document.getElementById(id);

  function field(node, value, placeholder, caret) {
    node.textContent = "";
    if (caret) node.append(Object.assign(document.createElement("span"), { className: "caret" }));
    if (value) node.prepend(value);
    else node.append(Object.assign(document.createElement("span"), { className: "ph", textContent: placeholder }));
  }

  function renderMock() {
    const t = STRINGS[lang];
    field($("mUrl"), M.url, t["app.url"], M.caret === "url");
    field($("mPath"), M.path, t["app.folder"], M.caret === "path");
    $("mChip").dataset.hidden = String(!M.chip);
    $("mChip").textContent = FMTS[M.fmt];
    $("mBrowse").textContent = t["app.browse"];
    const a = $("mAction");
    a.dataset.state = M.phase === "busy" || M.phase === "done" ? "white" : M.action;
    a.textContent = t[M.phase === "busy" ? "app.cancel" : M.phase === "done" ? "app.show" : "app.grab"];
    mock.dataset.phase = M.phase;
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));
  let visible = false;
  const waitVisible = () => new Promise(r => {
    const check = () => (visible && !document.hidden) ? r() : setTimeout(check, 300);
    check();
  });

  async function type(key, text, perChar) {
    M.caret = key;
    for (let i = 1; i <= text.length; i++) {
      M[key] = text.slice(0, i);
      renderMock();
      await sleep(perChar * (0.6 + Math.random() * 0.8));
    }
  }

  // one continuous run of the outline: a touch of ease at both ends, steady in between
  const fill = ms => new Promise(done => {
    const t0 = performance.now();
    const ease = t => 0.35 * t + 0.65 * (0.5 - Math.cos(Math.PI * t) / 2);
    const frame = now => {
      const t = Math.min(1, (now - t0) / ms);
      mock.style.setProperty("--p", (100 * ease(t)).toFixed(2));
      t < 1 ? requestAnimationFrame(frame) : done();
    };
    requestAnimationFrame(frame);
  });

  async function runDemo() {
    let lastPath = "";
    for (;;) {
      await waitVisible();
      Object.assign(M, { url: "", path: "", caret: "", chip: false, fmt: 0, action: "off", phase: "idle" });
      mock.style.setProperty("--p", 0);
      mock.dataset.clearing = "false";
      renderMock();
      await sleep(900);

      M.caret = "url"; renderMock(); await sleep(600);
      await type("url", LINK, 16);
      M.caret = ""; M.chip = true; renderMock();
      await sleep(900);
      // click the chip up to flac
      const chip = $("mChip");
      while (M.fmt < FMTS.length - 1) {
        chip.classList.remove("pop"); void chip.offsetWidth; chip.classList.add("pop");
        await sleep(120);
        M.fmt++; renderMock();
        await sleep(650);
      }

      let path;
      do { path = PATHS[Math.floor(Math.random() * PATHS.length)]; } while (path === lastPath);
      lastPath = path;
      await type("path", path, 55);
      M.caret = ""; M.action = "on"; renderMock();
      await sleep(800);

      const btn = $("mAction");
      btn.classList.add("press"); await sleep(170); btn.classList.remove("press");
      M.phase = "busy"; renderMock();
      await fill(3600);
      await sleep(450);
      M.phase = "done"; renderMock();
      await sleep(2800);

      mock.dataset.clearing = "true";
      M.phase = "idle"; M.action = "off"; M.chip = false; renderMock();
      await sleep(500);
    }
  }

  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) {
    Object.assign(M, { url: LINK, path: PATHS[0], chip: true, fmt: FMTS.length - 1, action: "on" });
    renderMock();
  } else {
    new IntersectionObserver(es => { visible = es.some(e => e.isIntersecting); }, { threshold: .35 }).observe(mock);
    runDemo();
  }
  apply();

  // ---- download modal ----
  const modal = document.getElementById("downloadModal");
  const close = () => modal.close();
  document.querySelectorAll("[data-open-download]").forEach(b => b.addEventListener("click", () => {
    if (typeof modal.showModal === "function") modal.showModal();
    else location.href = document.getElementById(/Win/i.test(navigator.userAgent) ? "dlWin" : "dlMac").href;
  }));
  document.getElementById("modalClose").addEventListener("click", close);
  // a click on the backdrop lands on the <dialog> itself, outside its box
  modal.addEventListener("click", e => {
    if (e.target !== modal) return;
    const r = modal.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) close();
  });
  modal.querySelectorAll("a").forEach(a => a.addEventListener("click", () => setTimeout(close, 150)));
})();
</script>
</body>
</html>
